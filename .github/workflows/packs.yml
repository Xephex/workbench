name: packs

# Install every committed platform pack offline, the way a user does: sparse
# clone, then `setup --packages-only`. Runners have no GPU, so the CUDA packs
# prove the install and the CPU fallback; the Vulkan/CPU packs are the default
# choice on these runners.

on:
  workflow_dispatch:
  push:
    branches: [main, plan2]  # plan2: temporary, removed before merge
    paths: ["packs/**", "workbench/install.py", ".github/workflows/packs.yml"]

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, pack: win-x64-vulkan }
          - { os: windows-2022, pack: win-x64-cuda12 }
          - { os: ubuntu-24.04, pack: linux-x64-vulkan }
          - { os: ubuntu-24.04, pack: linux-x64-cuda13 }
          - { os: ubuntu-24.04-arm, pack: linux-arm64-cpu }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.pack }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Sparse clone of this commit (what users run)
        run: |
          git clone --filter=blob:none --sparse --no-checkout "https://github.com/${GITHUB_REPOSITORY}" wb
          git -C wb checkout -q "${GITHUB_SHA}"

      - name: Skip packs that are not committed yet
        id: have
        run: |
          if git -C wb ls-tree -d --name-only HEAD "packs/${{ matrix.pack }}" | grep -q .; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::packs/${{ matrix.pack }} is not committed yet; skipping"
          fi

      - name: setup --packages-only
        if: steps.have.outputs.yes == 'true'
        working-directory: wb
        run: python workbench.py setup --packages-only --pack ${{ matrix.pack }}

      - name: Installed stack imports; no .exe; Windows has no monty
        if: steps.have.outputs.yes == 'true'
        working-directory: wb
        # A script file, not stdin: strawberry (via Phoenix) calls Path(<caller file>).samefile(),
        # and Windows rejects the name "<stdin>".
        run: python -I tools/check_pack_install.py ${{ matrix.pack }}

      - name: Second run is up to date
        if: steps.have.outputs.yes == 'true'
        working-directory: wb
        run: python workbench.py setup --packages-only --pack ${{ matrix.pack }} | tee out.txt && grep -q "Packages up to date" out.txt
